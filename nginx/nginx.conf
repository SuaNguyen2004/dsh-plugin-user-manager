worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Preserve client port in redirects (relative redirects)
    absolute_redirect off;
    port_in_redirect off;

    # DNS Resolver for dynamic proxy_pass variables
    resolver 127.0.0.11 192.168.65.7 8.8.8.8 valid=10s ipv6=off;

    # Map WebSocket connection upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream master_backend {
        server master-backend:4000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Client body & buffer settings
        client_max_body_size 50M;

        # 1. Healthcheck
        location = /health {
            proxy_pass http://master_backend/health;
        }

        # 2. Public Auth APIs, Admin Dashboard, Smart Redirect and Login UI
        location ~* ^/(login|login\.html|admin|admin\.html|public/|api/auth/register|api/auth/login|api/auth/smart-redirect) {
            proxy_pass http://master_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # 3. Master Backend Auth State, Change Password & Logout
        location ~* ^/api/auth/(me|logout|change-password) {
            proxy_pass http://master_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Admin Management APIs (Strictly routed to Master Backend RBAC)
        location /api/admin/ {
            proxy_pass http://master_backend/api/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Internal Auth Subrequest for Dynamic Container Routing
        location = /internal_route_resolve {
            internal;
            proxy_pass http://master_backend/api/gateway/resolve-route;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization $http_authorization;
        }

        # 6. User Sandbox Dynamic Routing (Protected by Master Backend auth_request)
        location / {
            auth_request /internal_route_resolve;
            auth_request_set $target_ip $upstream_http_x_target_ip;
            auth_request_set $target_port $upstream_http_x_target_port;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_name $upstream_http_x_user_name;

            # Intercept errors: both unauthenticated and sandbox 401
            proxy_intercept_errors on;
            error_page 401 = @redirect_to_smart;

            # Route dynamically to the isolated container direct IP and port
            proxy_pass http://$target_ip:$target_port;

            # Full WebSocket & streaming support for real-time DSH agent interaction
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-User-Name $user_name;

            proxy_connect_timeout 10s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Smart redirect: if not logged in -> /login; if logged in -> /?token=...
        location @redirect_to_smart {
            return 302 /api/auth/smart-redirect;
        }
    }
}

