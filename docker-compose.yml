# docker-compose.yml
# DSH Lite Enterprise - Shared Brain (dsh-main) + Single Gateway (dsh-gateway) + On-Demand Tool Sandboxes (dsh-tool) + Agentic RAG Stack

name: dsh-enterprise-lite

services:
  dsh-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: dsh-gateway:latest
    container_name: dsh-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-12345}
      INTERNAL_PORT: ${INTERNAL_PORT:-3091}
      SQLITE_PATH: /data/gateway/users.db
      DSH_MAIN_URL: http://dsh-main:3090
      DSH_TOOL_IMAGE: ${DSH_TOOL_IMAGE:-dsh-tool:latest}
      DOCKER_NETWORK: dsh-enterprise-lite_default
      JWT_SECRET: ${JWT_SECRET:-dsh-master-backend-enterprise-secret-2026}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dsh-internal-exec-secret-token-2026}
      TOOL_IDLE_MINUTES: ${TOOL_IDLE_MINUTES:-15}
      TOOL_RAM_MB: ${TOOL_RAM_MB:-256}
      TOOL_CPU_CORES: ${TOOL_CPU_CORES:-0.5}
      TOOL_PIDS_LIMIT: ${TOOL_PIDS_LIMIT:-128}
      TOOL_NETWORK_DISABLED: ${TOOL_NETWORK_DISABLED:-true}
    ports:
      - "12345:12345"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dsh-gateway-data:/data/gateway
      - dsh-homes:/data/dsh_homes
      - dsh-database:/data/database
    tmpfs:
      - /data/temp:size=64m,mode=1777,exec
    depends_on:
      - dsh-main
    networks:
      - default

  dsh-main:
    build:
      context: ./dsh-main
      dockerfile: Dockerfile
    image: dsh-main:latest
    container_name: dsh-main
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3090
      DSH_HOMES_ROOT: /data/dsh_homes
      DSH_HOME: /data/dsh_homes/admin
      GATEWAY_INTERNAL_URL: http://dsh-gateway:3091
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dsh-internal-exec-secret-token-2026}
    volumes:
      - dsh-homes:/data/dsh_homes
    tmpfs:
      - /data/temp:size=64m,mode=1777,exec
    networks:
      - default

  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dsh_rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dsh_rag_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-dsh_rag_db}
    ports:
      - "5432:5432"
    volumes:
      - dsh-pgdata:/var/lib/postgresql/data
    networks:
      - default

  embedding-service:
    image: ollama/ollama:latest
    container_name: embedding-service
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    networks:
      - default

  rag-api:
    build:
      context: ./rag-api
      dockerfile: Dockerfile
    image: rag-api:latest
    container_name: rag-api
    restart: unless-stopped
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-dsh_rag_user}:${POSTGRES_PASSWORD:-dsh_rag_pass_2026}@postgres-db:5432/${POSTGRES_DB:-dsh_rag_db}
      OLLAMA_URL: http://embedding-service:11434
    expose:
      - "8000"
    volumes:
      - dsh-knowledge-base:/data/kb_ro
    depends_on:
      - postgres-db
      - embedding-service
    networks:
      - default

volumes:
  dsh-gateway-data:
    name: dsh-gateway-data
  dsh-homes:
    name: dsh-homes
  dsh-database:
    name: dsh-database
  dsh-knowledge-base:
    name: dsh-knowledge-base
  dsh-pgdata:
    name: dsh-pgdata

networks:
  default:
    name: dsh-enterprise-lite_default
