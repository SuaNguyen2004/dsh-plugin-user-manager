# docker-compose.yml
# DeepSeek Harness Lite Enterprise Stack (1 Unified Gateway + Dynamic Sandboxes)

name: dsh-enterprise-lite

services:
  # Main Gateway: Authentication + Reverse Proxy + SQLite + Docker Orchestrator
  main-gateway:
    build:
      context: .
      dockerfile: master-backend/Dockerfile
    image: dsh-enterprise-main-gateway:latest
    container_name: dsh-enterprise-main-gateway
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 12345
      SQLITE_PATH: /app/data/users.db
      HOST_PROJECT_PATH: ${HOST_PROJECT_PATH:-C:/Users/Admin/Desktop/User Management}
    ports:
      - "12345:12345"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
